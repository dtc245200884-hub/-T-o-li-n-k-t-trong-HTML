<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên kết yêu thích</title>
</head>
<body>

    <h1>Liên kết yêu thích của tôi</h1>

    <ul>
        <!-- 1. Liên kết mở trong tab mới (target="_blank") -->
        <li>
            <a href="https://www.google.com" target="_blank">Google (Mở trong tab mới)</a>
        </li>

        <!-- 2. Các liên kết đến trang web bên ngoài -->
        <li>
            <a href="https://github.com" target="_blank">GitHub</a>
        </li>
        <li>
            <a href="https://www.youtube.com" target="_blank">YouTube</a>
        </li>

        <!-- 3. Liên kết đến file HTML khác trong cùng thư mục (Trang nội bộ) -->
        <li>
            <a href="about.html">Trang Giới thiệu (about.html)</a>
        </li>

        <!-- 4. Liên kết mở ứng dụng gửi Email (mailto:) -->
        <li>
            <a href="mailto:example@gmail.com">Gửi email cho tôi</a>
        </li>
    </ul>

</body>
</html>
